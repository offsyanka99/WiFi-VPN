name: Build

on:
  push:
    branches: [main, "improve/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: tags are mutable and a moved tag would
      # silently run different code in CI. Dependabot keeps the pins current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install platform and build-tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Release signing secrets are not available in CI, but R8 must still be exercised:
      # keep rules for WireGuard and Tink only break in a minified build.
      - name: Assemble release (minified)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
